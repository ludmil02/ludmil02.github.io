<P></P>
<STRONG>Abstract:</STRONG>
<P>
 Boltzmann equation is the basic equation for kinetic theory. It
has the dual particle-fluid property. We will illustrate this with the
wave structure of the Green's function and the boundary effects of thermal
creep.
