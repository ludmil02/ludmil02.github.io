<H1 ALIGN=CENTER>
Stability of peakons
</H1>

<P ALIGN=CENTER>
Adrian Constantin   <BR>
<BR>University of Lund, Sweden
<BR>
</P>

<P></P>
<STRONG>Abstract:</STRONG>
<P> The peakons are peaked solitary wave solutions 
of a recently derived model for shallow water waves. We 
present a simple proof of the stability of these wave 
patterns.
</P>
