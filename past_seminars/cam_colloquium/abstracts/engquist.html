<H1 ALIGN=CENTER>Wavelet based homogenization</H1>

<P ALIGN=CENTER>
Bjorn Engquist<BR>
  Department of Mathematics<BR>
  UCLA
</P>

<P>
<STRONG>Abstract:</STRONG>
A wavelet representation is used to derive a numerically homogenized
differential operator. The technique can be applied to subgrid scale
modeling and potentially as coarse grid operators in multigrid.
</P>
