<!DOCTYPE html>
<html lang="{{ site.lang | default: "en-US" }}">
  <head>
    {% include head_ltz1.html %}
    <style>
      /* All styling for the Markdown home page lives here, so that the
         page source itself can stay plain Markdown. */
      body { margin: 0; }
      #mdhome { width: 1024px; }
      #mdhome a:link    { color: #0000FF; }
      #mdhome a:visited { color: #00008B; }
      #mdhome a:hover   { color: #FF0000; }

      /* Blue banner: PSU logo, welcome text, CCMA logo. */
      #mdhome .banner {
        display: flex;
        align-items: center;
        justify-content: space-between;
        width: 1024px;
        height: 72px;
        margin: 0;
        padding: 0 10px;
        box-sizing: border-box;
        background-color: rgb(0,0,153);
        color: white;
        font-size: 1.25em;
        font-style: italic;
      }
      #mdhome .banner img { vertical-align: middle; }
      #mdhome .banner em { font-style: italic; }

      /* Portrait floated to the left of the "About me" paragraph. */
      #mdhome .portrait { margin: 5px 0 5px 5px; }
      #mdhome .portrait img { float: left; width: 155px; }
      #mdhome .about { margin: 5px 5px 5px 175px; }
      #mdhome .clear { clear: both; margin: 5px; }

      /* Horizontal rules replace the border-top/border-bottom tricks. */
      #mdhome hr {
        clear: both;
        height: 0;
        border: none;
        border-top: 2px solid #888;
        margin: 12px 0 8px 0;
      }
      #mdhome hr.thick { border-top: 6px solid #888; }

      #mdhome p  { margin: 5px; }
      #mdhome ul { margin: 5px 5px 10px 5px; }
      #mdhome li { margin: 0 0 10px 0; }
      #mdhome .links { white-space: nowrap; padding: 0; }
      #mdhome .copyright { float: right; }
    </style>
  </head>
  <body>
    <div id="mdhome">
      {{ content }}
    </div>
  </body>
</html>
